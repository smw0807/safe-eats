version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: safe-eats-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: safe-eats-api
    ports:
      - '3001:3001'
    env_file:
      - apps/api/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
    container_name: safe-eats-consumer
    env_file:
      - apps/consumer/.env
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
