name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Create .env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "RABBITMQ_URL=${RABBITMQ_URL}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "MFDS_API_KEY=${MFDS_API_KEY}"
            echo "SMTP_HOST=${SMTP_HOST}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASS=${SMTP_PASS}"
            echo "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            echo "VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}"
            echo "KAKAO_API_KEY=${KAKAO_API_KEY}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
          } > .env

      - name: Pull latest images
        run: |
          docker pull smw0807/safe-eats-api:latest
          docker pull smw0807/safe-eats-consumer:latest

      - name: Deploy with docker compose
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Remove unused images
        run: docker image prune -f
