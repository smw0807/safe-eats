version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: safe-eats-rabbitmq
    restart: always
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: smw0807/safe-eats-api:latest
    container_name: safe-eats-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      MFDS_API_KEY: ${MFDS_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy

  consumer:
    image: smw0807/safe-eats-consumer:latest
    container_name: safe-eats-consumer
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
